<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="黄博文的个人作品集与简历" />
  <title>黄博文 · 设计工程作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17231f;--muted:#6e7b74;--paper:#f4f5ef;--card:#fffef9;--line:#dfe5dc;--green:#176b50;--lime:#c9f36b;--shadow:0 20px 50px rgba(24,43,33,.09);font-family:"DM Sans",sans-serif;color:var(--ink);color-scheme:light}
    [data-theme="dark"]{--ink:#eff6ee;--muted:#a4b4a8;--paper:#101914;--card:#18231c;--line:#304037;--green:#b8ef6a;--lime:#b7e85d;--shadow:0 20px 50px rgba(0,0,0,.22);color-scheme:dark}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55}button,a{font:inherit}a{color:inherit}button{cursor:pointer}
    .shell{max-width:1240px;margin:auto;padding:24px 34px 70px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 58px}.brand{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.04em;font-size:20px;text-decoration:none}.brand span{color:var(--green)}.top-actions{display:flex;gap:10px;align-items:center}.icon-button,.menu-button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}.menu-button{display:none}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:70px;align-items:center;padding-bottom:100px}.eyebrow{color:var(--green);font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:0 0 18px}.hero h1{font-family:"Space Grotesk";font-size:clamp(46px,7vw,90px);line-height:.97;letter-spacing:-.075em;max-width:760px;margin:0}.hero h1 em{font-style:normal;color:var(--green)}.hero-copy{color:var(--muted);font-size:18px;max-width:560px;margin:26px 0 30px}.hero-links{display:flex;gap:12px;flex-wrap:wrap}.button{border:0;background:var(--green);color:#fff;padding:13px 19px;border-radius:6px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.hero-art{position:relative;min-height:365px}.portrait{height:390px;border-radius:48% 48% 10px 10px;background:url('https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=900&q=85') center/cover;filter:saturate(.72);position:relative;overflow:hidden}.portrait:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 45%,rgba(23,107,80,.35))}.stamp{position:absolute;right:-18px;bottom:30px;background:var(--lime);border-radius:50%;width:112px;height:112px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;line-height:1.15;transform:rotate(11deg);box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}.section{border-top:1px solid var(--line);padding:68px 0}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.section-heading h2{font-family:"Space Grotesk";font-size:clamp(30px,4vw,48px);line-height:1;letter-spacing:-.06em;margin:0}.section-heading p{color:var(--muted);max-width:310px;margin:0}.about-copy{grid-column:span 7;font-size:26px;line-height:1.25;letter-spacing:-.035em;margin:0}.about-notes{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--card)}.note strong{font-family:"Space Grotesk";font-size:28px;display:block;margin-bottom:8px}.note span{font-size:13px;color:var(--muted)}
    .filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:99px;font-size:13px}.filter.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.project{grid-column:span 6;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);transition:transform .25s,box-shadow .25s}.project:hover{transform:translateY(-6px);box-shadow:var(--shadow)}.project-image{height:270px;background-size:cover;background-position:center;position:relative}.project-type{position:absolute;left:16px;top:16px;background:var(--lime);padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}.project-info{padding:20px}.project-info h3{font-family:"Space Grotesk";font-size:25px;letter-spacing:-.04em;margin:0 0 8px}.project-info p{color:var(--muted);font-size:14px;margin:0 0 15px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{color:var(--green);font-size:12px;font-weight:700;background:rgba(23,107,80,.08);border-radius:4px;padding:5px 8px}
    .timeline{grid-column:span 7}.timeline-item{display:grid;grid-template-columns:130px 1fr;gap:22px;border-bottom:1px solid var(--line);padding:0 0 24px;margin-bottom:24px}.period{color:var(--muted);font-size:13px}.timeline-item h3{font-family:"Space Grotesk";font-size:21px;margin:0 0 4px}.timeline-item p{color:var(--muted);font-size:14px;margin:0}.skills{grid-column:span 5}.skill{margin-bottom:20px}.skill-head{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:7px}.skill-head span{color:var(--muted);font-weight:400}.track{height:5px;background:var(--line);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--green);border-radius:99px;transform-origin:left;animation:grow 1.2s ease both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .contact{background:var(--green);color:#fff;border-radius:12px;padding:46px;display:flex;justify-content:space-between;align-items:end;gap:30px}.contact h2{font-family:"Space Grotesk";font-size:clamp(32px,5vw,62px);letter-spacing:-.07em;line-height:1;margin:0;max-width:620px}.contact p{opacity:.75;margin:16px 0 0}.contact .button{background:var(--lime);color:var(--ink)}footer{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding-top:28px}
    @media(max-width:800px){.shell{padding:18px 20px 50px}.topbar{padding-bottom:38px}.top-actions .button{display:none}.menu-button{display:grid}.hero{grid-template-columns:1fr;gap:38px;padding-bottom:60px}.hero-art{min-height:300px}.portrait{height:310px}.stamp{right:0}.about-copy,.about-notes,.project,.timeline,.skills{grid-column:1/-1}.section{padding:48px 0}.section-heading{display:block}.section-heading p{margin-top:14px}.filters{margin-top:20px}.project-image{height:220px}.timeline-item{grid-template-columns:95px 1fr}.contact{display:block;padding:30px}.contact .button{margin-top:24px}footer{display:block}footer span{display:block;margin-top:6px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="#top">HB<span>。</span></a><div class="top-actions"><a class="button secondary" href="#contact">一起做点有趣的事 <span>↗</span></a><button class="icon-button" id="themeToggle" aria-label="切换主题">◐</button><button class="menu-button" aria-label="打开菜单">☰</button></div></header>
    <main id="top">
      <section class="hero"><div><p class="eyebrow" id="heroEyebrow"></p><h1 id="heroTitle"></h1><p class="hero-copy" id="heroSummary"></p><div class="hero-links"><a class="button" href="#projects">浏览作品 <span>↓</span></a><a class="button secondary" href="#contact">联系我 <span>↗</span></a></div></div><div class="hero-art"><div class="portrait"></div><div class="stamp">DESIGN<br>WITH<br>INTENT</div></div></section>
      <section class="section grid" id="about"><div class="section-heading" style="grid-column:1/-1"><div><p class="eyebrow">01 / 关于我</p><h2>让简单的事，<br>变得复杂难用。</h2></div><p>摸鱼与摆烂不是二选一。我用两种视角，创造更模糊、更垃圾的数据体验。</p></div><p class="about-copy" id="aboutText"></p><div class="about-notes" id="aboutNotes"></div></section>
      <section class="section" id="projects"><div class="section-heading"><div><p class="eyebrow">02 / 精选作品</p><h2>我最近在做什么</h2></div><div class="filters" id="projectFilters"></div></div><div class="grid" id="projectGrid"></div></section>
      <section class="section grid" id="experience"><div class="section-heading" style="grid-column:1/-1"><div><p class="eyebrow">03 / 轨迹</p><h2>一路走来</h2></div></div><div class="timeline" id="experienceList"></div><div class="skills"><p class="eyebrow">能力雷达</p><div id="skillsList"></div></div></section>
      <section class="section" id="contact"><div class="contact"><div><p class="eyebrow" style="color:var(--lime)">04 / 保持联系</p><h2>有想法？<br>我们聊聊。</h2><p id="contactLine"></p></div><a class="button" id="emailLink" href="mailto:"></a></div></section>
    </main>
    <footer><span>© <span id="year"></span> 黄博文</span><span>设计、代码与持续好奇心</span></footer>
  </div>
  <script>
    // 修改这里的内容即可更新整个网站，页面模块会自动重新渲染。
    const portfolioData={profile:{name:'黄博文',role:'设计工程师 / Frontend Engineer',eyebrow:'设计工程师 · 上海 / 远程',summary:'我把摸鱼，摆烂与嘴脸都写在脸上，专注与打造冰冷、低效的工作环境（请到我就算是你倒了八辈子霉）',about:'过去20年，我在工位、厕所和小吃街之间来回穿梭。从1到0构建产品，也把成熟系统打磨成面粉。',email:'hello@huangbowen.design',contact:'目前开放合作与全职机会。通常会在 2 个工作日内回复。'},notes:[['08+','年工作经验'],['42','个上线项目'],['12','个设计系统'],['∞','保持好奇']],projects:[{title:'Lumen 数据工作台',type:'产品设计 · 前端',category:'产品',description:'为增长团队打造的实时数据分析工具，让复杂指标变成可行动的下一步。',tags:['React','TypeScript','Design System'],image:'https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=1000&q=85'},{title:'Mori 城市生活',type:'品牌网站 · 体验',category:'网站',description:'一个关于城市漫游的编辑型平台，用更慢的节奏重新发现身边的风景。',tags:['Art Direction','Webflow','CMS'],image:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1000&q=85'},{title:'Flow 组件系统',type:'系统设计 · 工程',category:'系统',description:'服务 6 个业务团队的跨平台设计系统，把一致性变成产品团队的加速器。',tags:['Figma','Vue','Storybook'],image:'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1000&q=85'},{title:'声色音乐节',type:'视觉识别 · 互动',category:'品牌',description:'为独立音乐节构建一套会“呼吸”的视觉身份，让现场气氛延伸到线上。',tags:['Branding','Motion','Creative Code'],image:'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=1000&q=85'}],experience:[['2022 — 至今','木棉科技 · 设计工程师','负责核心产品的体验策略、设计系统与前端架构，带领跨职能团队交付复杂 B 端工具。'],['2019 — 2022','纸飞机工作室 · 交互设计师','为消费品牌与创业团队提供从用户研究到产品落地的完整设计服务。'],['2017 — 2019','自由职业 · 网页设计师','与不同领域的伙伴合作，完成品牌网站、互动展览和数字化产品。']],skills:[['产品设计',92],['前端开发',88],['设计系统',94],['动效与原型',80]]};
    const $=selector=>document.querySelector(selector);
    function renderProjects(filter){const projects=filter==='全部'?portfolioData.projects:portfolioData.projects.filter(project=>project.category===filter);$('#projectGrid').innerHTML=projects.map(project=>`<article class="project"><div class="project-image" style="background-image:url('${project.image}')"><span class="project-type">${project.type}</span></div><div class="project-info"><h3>${project.title}</h3><p>${project.description}</p><div class="tags">${project.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div></div></article>`).join('')}
    function render(){const p=portfolioData.profile;$('#heroEyebrow').textContent=p.eyebrow;$('#heroTitle').innerHTML='把简单的事，<br><em>变复杂。</em>';$('#heroSummary').textContent=p.summary;$('#aboutText').textContent=p.about;$('#contactLine').textContent=p.contact;$('#emailLink').href=`mailto:${p.email}`;$('#emailLink').innerHTML=`${p.email} <span>↗</span>`;$('#year').textContent=new Date().getFullYear();$('#aboutNotes').innerHTML=portfolioData.notes.map(([value,label])=>`<div class="note"><strong>${value}</strong><span>${label}</span></div>`).join('');$('#projectFilters').innerHTML=['全部',...new Set(portfolioData.projects.map(project=>project.category))].map((category,index)=>`<button class="filter ${index===0?'active':''}" data-filter="${category}">${category}</button>`).join('');renderProjects('全部');$('#experienceList').innerHTML=portfolioData.experience.map(([period,title,description])=>`<article class="timeline-item"><div class="period">${period}</div><div><h3>${title}</h3><p>${description}</p></div></article>`).join('');$('#skillsList').innerHTML=portfolioData.skills.map(([name,level])=>`<div class="skill"><div class="skill-head">${name}<span>${level}%</span></div><div class="track"><i style="width:${level}%"></i></div></div>`).join('')}
    document.addEventListener('click',event=>{const filter=event.target.closest('[data-filter]');if(filter){document.querySelectorAll('.filter').forEach(button=>button.classList.remove('active'));filter.classList.add('active');renderProjects(filter.dataset.filter)}if(event.target.id==='themeToggle'){const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('theme',dark?'light':'dark')}});if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark';render();
  </script>
</body>
</html>
