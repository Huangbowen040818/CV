<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ZPP 项目页面">
  <title>ZPP · 项目页面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-ui-black: #0A0A0A;
      --color-ui-background: #F7F7F5;
      --color-text-secondary: #686460;
      --color-ui-muted: #B8B3AD;
      --color-accent-lime: #E9F138;
      --color-accent-ochre: #D8A42F;
      --color-accent-deepgreen: #204A3B;
      --color-accent-red: #E02030;
      --color-accent-skyblue: #72B8E8;
      --btn-primary-bg: #000000;
      --link-color: #0A0A0A;

      --grid-columns: 12;
      --container-width: 1200px;
      --container-gutter: 32px;
      --space-base: 8px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 40px;
      --space-6: 48px;
      --space-7: 56px;
      --space-8: 64px;
      --card-radius: 18px;
      --card-shadow: 0 18px 40px rgba(10, 10, 10, 0.08);
      --line: rgba(247, 247, 245, 0.2);
      --ink: var(--color-ui-background);
      --muted: var(--color-ui-muted);
      --paper: var(--color-ui-black);
      --card: var(--color-ui-background);
      --green: var(--color-accent-deepgreen);
      --lime: var(--color-accent-lime);
      --font-heading: "Space Grotesk", "DM Sans", "Segoe UI", sans-serif;
      --font-body: "DM Sans", "Segoe UI", sans-serif;
      font-family: var(--font-body);
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      font-family: var(--font-body);
    }
    a { color: inherit; text-decoration: none; }
    .shell {
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 28px var(--container-gutter) 70px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 64px;
    }
    .brand {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-decoration: none;
    }
    .brand span { color: var(--green); }
    .back {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 15px;
      text-decoration: none;
      font-weight: 700;
      background: var(--card);
      color: var(--ink);
    }
    .eyebrow {
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0 0 18px;
    }
    .hero {
      display: grid;
      grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr));
      gap: 24px;
      align-items: end;
      padding: 48px 32px 0;
      margin-bottom: 64px;
      background: linear-gradient(135deg, var(--ec-key-color-level-7) 0%, #0d3d4d 100%);
      border-radius: 30px;
      overflow: hidden;
    }
    .hero > div:first-child {
      grid-column: 1 / span 7;
      padding-bottom: 48px;
    }
    .hero > div:last-child {
      grid-column: 9 / span 4;
      min-height: 350px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .hero h1 {
      font-family: var(--font-heading);
      font-size: clamp(56px, 10vw, 120px);
      line-height: 0.88;
      letter-spacing: -0.08em;
      margin: 0;
      color: var(--ec-neutral-white);
    }
    .hero h1 em {
      color: var(--lime);
      font-style: normal;
    }
    .intro {
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      max-width: 430px;
      margin: 24px 0 0;
    }
    .visual {
      width: min(100%, 440px);
      min-height: 350px;
      border-radius: 42% 42% 18px 18px;
      background: linear-gradient(135deg, rgba(211,244,251,.9), rgba(30,122,135,.9)), url('https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1000&q=85') center/cover;
      display: grid;
      place-items: center;
      color: var(--ec-neutral-white);
      font-family: var(--font-heading);
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.08em;
      box-shadow: 0 24px 60px rgba(6, 40, 52, 0.12);
    }
    .section {
      border-top: 1px solid var(--line);
      padding: 64px 0;
    }
    .section h2 {
      font-family: var(--font-heading);
      font-size: clamp(30px, 5vw, 54px);
      letter-spacing: -0.06em;
      line-height: 1;
      margin: 0 0 24px;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .detail {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
    }
    .detail strong {
      font-family: var(--font-heading);
      font-size: 24px;
      display: block;
      margin-bottom: 8px;
      color: var(--green);
    }
    .detail span {
      color: var(--muted);
      font-size: 14px;
    }
    .statement {
      font-size: clamp(24px, 4vw, 42px);
      letter-spacing: -0.04em;
      line-height: 1.2;
      max-width: 820px;
      color: var(--ink);
    }
    footer {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      padding-top: 30px;
    }
    .hero { background: var(--color-ui-background); }
    .hero h1 { color: var(--color-ui-black); }
    .hero h1 em, .eyebrow, .brand span { color: var(--color-accent-deepgreen); }
    .hero .eyebrow { color: var(--color-accent-deepgreen); }
    .intro { color: var(--color-text-secondary); }
    .visual { background: linear-gradient(135deg, rgba(216,164,47,.9), rgba(32,74,59,.92)), url('https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1000&q=85') center/cover; }
    .detail strong { color: var(--color-accent-deepgreen); }

    .detail { color: var(--color-ui-black); }
    .detail span { color: var(--color-text-secondary); }

    @media (max-width: 800px) {
      .shell { padding: 20px 20px 50px; }
      .topbar { padding-bottom: 50px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 32px 20px 0;
      }
      .hero > div:first-child,
      .hero > div:last-child {
        grid-column: auto;
        width: 100%;
      }
      .hero h1 { font-size: clamp(42px, 18vw, 88px); }
      .details { grid-template-columns: 1fr; }
      .visual { min-height: 260px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="index.html">HB<span>。</span></a><a class="back" href="index.html">返回首页 ↗</a></header>
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">ZPP / 独立项目</p>
          <h1>把摆烂<br><em>放脸上。</em></h1>
          <p class="intro">一个用于记录实验、灵感与不太成熟想法的项目空间。这里先放下完美主义，专注于把东西交付出来。</p>
        </div>
        <div class="visual">ZPP</div>
      </section>

      <section class="section">
        <p class="eyebrow">项目概览</p>
        <h2>从一个模糊的念头开始。</h2>
        <p class="statement">ZPP 是一个持续生长的数字实验场，收集设计、代码和日常观察，慢慢把它们变成可以使用的东西。</p>
      </section>

      <section class="section">
        <div class="details">
          <div class="detail"><strong>01</strong><span>整理问题，找到值得继续的方向。</span></div>
          <div class="detail"><strong>02</strong><span>快速制作，用真实反馈替代猜测。</span></div>
          <div class="detail"><strong>03</strong><span>保留过程，让每次迭代都留下痕迹。</span></div>
        </div>
      </section>
    </main>
    <footer><span>© 2026 黄博文</span><span>ZPP · 持续更新中</span></footer>
  </div>
</body>
</html>
