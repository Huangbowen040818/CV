<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ZPP 项目页面">
  <title>ZPP · 项目页面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17231f;--muted:#6e7b74;--paper:#f4f5ef;--card:#fffef9;--line:#dfe5dc;--green:#176b50;--lime:#c9f36b;font-family:"DM Sans",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55}.shell{max-width:1120px;margin:auto;padding:28px 34px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:90px}.brand{font-family:"Space Grotesk";font-size:20px;font-weight:700;letter-spacing:-.04em;text-decoration:none}.brand span{color:var(--green)}.back{border:1px solid var(--line);border-radius:6px;padding:10px 15px;text-decoration:none;font-weight:700}.eyebrow{color:var(--green);font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:0 0 18px}.hero{display:grid;grid-template-columns:1fr .8fr;gap:70px;align-items:end;padding-bottom:90px}.hero h1{font-family:"Space Grotesk";font-size:clamp(56px,10vw,120px);line-height:.88;letter-spacing:-.08em;margin:0}.hero h1 em{color:var(--green);font-style:normal}.intro{color:var(--muted);font-size:18px;max-width:430px;margin:24px 0 0}.visual{min-height:350px;border-radius:48% 48% 10px 10px;background:linear-gradient(135deg,rgba(201,243,107,.9),rgba(23,107,80,.9)),url('https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1000&q=85') center/cover;display:grid;place-items:center;color:#fff;font-family:"Space Grotesk";font-size:52px;font-weight:700;letter-spacing:-.08em}.section{border-top:1px solid var(--line);padding:62px 0}.section h2{font-family:"Space Grotesk";font-size:clamp(30px,5vw,54px);letter-spacing:-.06em;line-height:1;margin:0 0 24px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}.detail strong{font-family:"Space Grotesk";font-size:24px;display:block;margin-bottom:8px}.detail span{color:var(--muted);font-size:14px}.statement{font-size:clamp(24px,4vw,42px);letter-spacing:-.04em;line-height:1.2;max-width:820px}footer{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding-top:30px}@media(max-width:760px){.shell{padding:20px 20px 50px}.topbar{padding-bottom:55px}.hero{grid-template-columns:1fr;gap:35px;padding-bottom:55px}.visual{min-height:270px}.details{grid-template-columns:1fr}.topbar{align-items:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/">HB<span>。</span></a><a class="back" href="/">返回首页 ↗</a></header>
    <main>
      <section class="hero"><div><p class="eyebrow">ZPP / 独立项目</p><h1>把摆烂<br><em>放脸上。</em></h1><p class="intro">一个用于记录实验、灵感与不太成熟想法的项目空间。这里先放下完美主义，专注于把东西交付出来。</p></div><div class="visual">ZPP</div></section>
      <section class="section"><p class="eyebrow">项目概览</p><h2>从一个模糊的念头开始。</h2><p class="statement">ZPP 是一个持续生长的数字实验场，收集设计、代码和日常观察，慢慢把它们变成可以使用的东西。</p></section>
      <section class="section"><div class="details"><div class="detail"><strong>01</strong><span>整理问题，找到值得继续的方向。</span></div><div class="detail"><strong>02</strong><span>快速制作，用真实反馈替代猜测。</span></div><div class="detail"><strong>03</strong><span>保留过程，让每次迭代都留下痕迹。</span></div></div></section>
    </main>
    <footer><span>© 2026 黄博文</span><span>ZPP · 持续更新中</span></footer>
  </div>
</body>
</html>
